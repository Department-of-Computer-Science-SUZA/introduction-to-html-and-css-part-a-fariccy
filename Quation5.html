<!DOCTYPE html>
<html>
<head>
    <title>Pizza Shop 2.0</title>
</head>
<body>

    <form>
        <table>
            <tr>
                <th colspan="2">Pizza Shop 2.0</th>
            </tr>
            <tr>
                <td>Name</td>
                <td><input type="text" name="name" size="30"></td>
            </tr>
            <tr>
                <td>Pizza Topping</td>
                <td>
                    <input type="radio" name="topping" value="supreme"> Supreme<br>
                    <input type="radio" name="topping" value="vegetarian"> Vegetarian<br>
                    <input type="radio" name="topping" value="hawaiian"> Hawaiian
                </td>
            </tr>
            <tr>
                <td>Pizza Sauce</td>
                <td>
                    <select name="sauce">
                        <option>Tomato</option>
                        <option>BBQ</option>
                        <option>Alfredo</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Optional Extras</td>
                <td>
                    <input type="checkbox" name="extra_cheese"> Extra Cheese<br>
                    <input type="checkbox" name="gluten_free"> Gluten Free Base
                </td>
            </tr>
            <tr>
                <td>Delivery Instructions:</td>
                <td><textarea name="instructions"></textarea></td>
            </tr>
            <tr>
                <td colspan="2" style="text-align:center;">
                    <input type="submit" value="Send my Order">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
