<!DOCTYPE html>
<html>
<head>
    <title>HTML Forms Example</title>
</head>
<body>

    <form>
        <fieldset>
            <legend><b>Academic information</b></legend>

            <label for="degree">Degree</label>
            <select name="degree" id="degree">
                <option>Master of Business Administration</option>
            </select><br><br>

            <label for="student-id">Student ID</label>
            <input type="text" id="student-id" name="student-id"><br><br>

            <label for="classes">Classes attended</label><br>
            <select name="classes" id="classes" size="3" multiple>
                <option>Geography</option>
                <option>Mathematics</option>
                <option>English</option>
            </select>
        </fieldset>

        <br>

        <fieldset>
            <legend><b>Personal Details</b></legend>

            <label for="fname">First Name</label>
            <input type="text" id="fname" name="fname"><br><br>

            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lname"><br><br>

            Gender:
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br><br>

            <label for="email">Email</label>
            <input type="email" id="email" name="email">
        </fieldset>

        <br>

        <textarea rows="5" cols="50">TERMS AND CONDITIONS...</textarea><br><br>

        <input type="submit" value="Send Form">
        <input type="reset" value="Clear Form">
    </form>

</body>
</html>
