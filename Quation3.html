<!DOCTYPE html>
<html>
<head>
    <title>Complex Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: auto;
        }
        th, td {
            border: 2px solid #000;
            padding: 10px;
            text-align: center;
        }
        .gray {
            background-color: #d3d3d3;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <th colspan="4">Table Heading Cell Spanning 4 Columns</th>
        </tr>
        <tr>
            <td>Normal cell</td>
            <td colspan="2">Cell spanning 2 columns</td>
            <td>Normal cell</td>
        </tr>
        <tr>
            <td rowspan="3" class="gray">Cell spanning 3 rows with a gray (US spelling) background</td>
            <td>Normal cell</td>
            <td>Normal cell</td>
            <td>Normal cell</td>
        </tr>
        <tr>
            <td>Normal cell</td>
            <td colspan="2" rowspan="2">Cell spanning 2 rows and 2 columns</td>
        </tr>
        <tr>
            <td>Normal cell</td>
        </tr>
    </table>

</body>
</html>
